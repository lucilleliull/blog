<script>
(() => {
  const dateNodes = document.querySelectorAll('[data-live-date]');
  if (!dateNodes.length) return;

  const formatter = new Intl.DateTimeFormat('en-GB', {
    timeZone: 'Asia/Shanghai',
    day: '2-digit',
    month: 'short',
    year: 'numeric'
  });

  const updateXiamenDate = () => {
    const now = new Date();
    const displayDate = formatter.format(now).toUpperCase();
    const dateParts = new Intl.DateTimeFormat('en-GB', {
      timeZone: 'Asia/Shanghai',
      year: 'numeric',
      month: '2-digit',
      day: '2-digit'
    }).formatToParts(now);
    const part = (type) => dateParts.find((item) => item.type === type)?.value || '';
    const machineDate = `${part('year')}-${part('month')}-${part('day')}`;

    dateNodes.forEach((node) => {
      node.textContent = `XIAMEN · ${displayDate}`;
      node.setAttribute('datetime', machineDate);
    });
  };

  updateXiamenDate();
  window.setInterval(updateXiamenDate, 60000);
})();
</script>
{{- if eq .Layout "lucille-search" }}
<script>
(() => {
  const box = document.getElementById('searchbox');
  const input = document.getElementById('searchInput');
  const results = document.getElementById('searchResults');
  const status = document.getElementById('searchStatus');
  let articles = [];

  const initialQuery = new URLSearchParams(window.location.search).get('q');
  if (initialQuery) input.value = initialQuery;

  const normalize = (value) => String(value || '').toLocaleLowerCase('zh-CN');
  const render = () => {
    const query = normalize(input.value.trim());
    results.replaceChildren();
    if (!query) {
      status.textContent = '';
      return;
    }
    const matches = [];
    const seen = new Set();
    for (const article of articles) {
      if (seen.has(article.permalink)) continue;
      if (!normalize(`${article.title} ${article.summary} ${article.content}`).includes(query)) continue;
      seen.add(article.permalink);
      matches.push(article);
      if (matches.length === 20) break;
    }
    status.textContent = matches.length ? `${matches.length} article${matches.length === 1 ? '' : 's'} found` : 'No matching articles';
    matches.forEach((article) => {
      const item = document.createElement('li');
      const link = document.createElement('a');
      link.href = article.permalink;
      link.textContent = article.title;
      item.append(link);
      results.append(item);
    });
  };

  fetch(box.dataset.indexUrl)
    .then((response) => {
      if (!response.ok) throw new Error('Search index unavailable');
      return response.json();
    })
    .then((data) => {
      articles = Array.isArray(data) ? data : [];
      input.addEventListener('input', render);
      render();
    })
    .catch(() => {
      status.textContent = 'Search is temporarily unavailable.';
    });
})();
</script>
{{- end }}
