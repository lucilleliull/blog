{{- define "main" }}
<header class="journal-page-header compact-page-header">
  <p class="section-number">(SEARCH)</p>
  <h1>Find a note<br><em>worth returning to.</em></h1>
  <div class="page-intro"><p>Search titles, summaries, and the complete text of every article.</p></div>
</header>
<div id="searchbox" data-index-url="{{ "index.json" | relLangURL }}">
  <label for="searchInput">SEARCH THE JOURNAL</label>
  <input id="searchInput" autofocus placeholder="A title, phrase, or subject…" aria-label="Search the journal" type="search" autocomplete="off" maxlength="64">
  <p id="searchStatus" class="search-status" aria-live="polite"></p>
  <ul id="searchResults" aria-label="Search results"></ul>
</div>
{{- end }}
