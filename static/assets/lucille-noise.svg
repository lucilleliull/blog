<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <filter id="noise" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="4" seed="17" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncR type="linear" slope="1.35" intercept="-0.18"/>
      <feFuncG type="linear" slope="1.35" intercept="-0.18"/>
      <feFuncB type="linear" slope="1.35" intercept="-0.18"/>
      <feFuncA type="table" tableValues="0 0.72"/>
    </feComponentTransfer>
  </filter>
  <rect width="180" height="180" filter="url(#noise)" opacity="0.58"/>
</svg>
