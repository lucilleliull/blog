baseURL = "https://lucille-blog.pages.dev/"
languageCode = "zh-cn"
defaultContentLanguage = "zh-cn"
title = "LUCILLE"
theme = "PaperMod"
copyright = "© 2026 Lucille"

enableRobotsTXT = true
[pagination]
  pagerSize = 20

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  env = "production"
  description = "Lucille's independent journal on reading, travel, investing, and the texture of lived experience."
  author = "Lucille"
  mainSections = ["posts"]
  defaultTheme = "light"
  disableThemeToggle = true
  disableScrollToTop = true

  ShowReadingTime = true
  ShowWordCount = false
  ShowBreadCrumbs = false
  ShowCodeCopyButtons = true
  ShowPostNavLinks = true
  ShowRssButtonInSectionTermList = true

  ShowToc = false

  [params.homeInfoParams]
    Title = "A notebook for things worth keeping."
    Content = "Essays, field notes, investment theses, and travel journals — published only when they are ready."

  [params.label]
    text = "LUCILLE"

  [params.footer]
    text = "[RSS](/index.xml) · [归档](/archives/)"

  [params.assets]
    theme_color = "#f6f4ee"
    msapplication_TileColor = "#f6f4ee"

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 2
    keys = ["title", "permalink", "summary", "content"]

[menu]
  [[menu.main]]
    name = "ARTICLES"
    url = "/posts/"
    weight = 1

  [[menu.main]]
    name = "PROJECTS"
    url = "/projects/"
    weight = 2

  [[menu.main]]
    name = "ABOUT"
    url = "/about/"
    weight = 3

[markup]
  [markup.highlight]
    noClasses = false
