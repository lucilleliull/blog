baseURL = "https://lucille-blog.pages.dev/"
languageCode = "zh-cn"
defaultContentLanguage = "zh-cn"
title = "LUCILLE"
theme = "PaperMod"
copyright = "© 2026 Lucille"

enableRobotsTXT = true
[pagination]
  pagerSize = 20

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  env = "production"
  description = "Lucille 的个人长期出版物：经过时间筛选以后，仍然值得留下来的文章、项目和判断。"
  author = "Lucille"
  mainSections = ["posts"]
  defaultTheme = "light"
  disableThemeToggle = true
  disableScrollToTop = true

  ShowReadingTime = true
  ShowWordCount = false
  ShowBreadCrumbs = false
  ShowCodeCopyButtons = true
  ShowPostNavLinks = true
  ShowRssButtonInSectionTermList = true

  ShowToc = false

  [params.homeInfoParams]
    Title = "你选择的视角，就是你想体验的世界。"
    Content = "一份关于阅读、旅行、投资与真实经验的个人长期出版物。"

  [params.label]
    text = "LUCILLE"

  [params.footer]
    text = "[RSS](/index.xml) · [归档](/archives/)"

  [params.assets]
    theme_color = "#f6f4ee"
    msapplication_TileColor = "#f6f4ee"

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 2
    keys = ["title", "permalink", "summary", "content"]

[menu]
  [[menu.main]]
    name = "文章"
    url = "/posts/"
    weight = 1

  [[menu.main]]
    name = "项目"
    url = "/projects/"
    weight = 2

  [[menu.main]]
    name = "关于"
    url = "/about/"
    weight = 3

[markup]
  [markup.highlight]
    noClasses = false
